<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>6News Election Graphics</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* Lower third, corner circles and Seat Called keep the original palette; seat and statewide rows use CATS / STATE in the script */
:root{--c0:#f0000d;--c1:#0050b1;--c2:#408f38;--c3:#e67f00;--c4:#929290;--c5:#0f9d9a;--l0:#f5535d;--l1:#2f74c9;--l2:#4eac61;--l3:#e69849;--l4:#adadab}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Barlow,sans-serif}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{background:linear-gradient(#18bff4,#2578bd)}
.abs{position:absolute}
.circ{position:absolute;border-radius:50%;filter:drop-shadow(-3px 4px 5px rgba(0,0,0,.35))}
/* full-screen card (statewide + seat results) */
.card{position:absolute;left:108px;top:67px;width:1704px;height:946px;background:#efefef;border-radius:16px}
.ttl{position:absolute;left:326px;top:54px;width:1052px;height:110px;text-align:center;white-space:nowrap;font:800 105px/110px Barlow,sans-serif;color:#000}
.ttl span{display:inline-block}
.cnt{position:absolute;left:0;width:1704px;top:154px;text-align:center;font:500 52px/56px 'Barlow Condensed',sans-serif;color:#000}
.row{position:absolute;left:58px;width:1588px;height:114px;background:#fff;border-radius:16px}
.row b{position:absolute;left:12px;font:700 70px/114px Barlow,sans-serif}
.row i{position:absolute;left:1136px;top:13px;width:413px;height:88px;border-radius:12px;color:#fff;text-align:center;font:700 70px/88px Barlow,sans-serif}
/* seat results rows: candidate name over party, primary pill (+ 2CP pill) */
.row.s{height:98px}
.row.s b{line-height:98px;font-size:60px}
.row.s b.cand{top:8px;line-height:1;font-size:52px}
.row.s i{top:11px;width:280px;height:76px;line-height:76px;font-size:60px}
.nmbox{width:880px;height:54px;line-height:54px;font-size:52px;white-space:nowrap}
.nm,.pn{display:inline-block;white-space:nowrap}
.sub{font-size:28px;line-height:28px;white-space:nowrap}
/* seat called */
.ct{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;line-height:0}
/* clock */
.clock{position:absolute;left:0;top:37px;width:209px;height:163px;border-radius:0 20px 20px 0;overflow:hidden;font-weight:700;color:#fff;text-align:center}
.clock .live{height:38px;line-height:38px;background:#ff6048;font-size:26px}
.clock img{display:block;width:209px;height:88px;object-fit:cover}
.clock .time{height:38px;line-height:38px;background:#3ba5e6;font-size:27px}
/* lower third: both boxes share one 1704px-wide gradient */
.portal{position:absolute;left:0;top:925px;width:1920px;height:110px;overflow:hidden}
#ltin{position:absolute;left:0;top:0;width:1920px;height:110px}
.lt{position:absolute;left:108px;top:0;width:1704px;height:110px;border-radius:20px;background:linear-gradient(90deg,#18bff4,#2578bd);background-size:1704px 100%}
.lt h1{position:absolute;left:33px;top:0;font:700 40px/50px Barlow,sans-serif;color:#fff}
.win{position:absolute;left:1496px;top:8px;width:175px;height:38px;border-radius:14px;background:#0a0d17;color:#fff;text-align:center;font:700 25px/38px Barlow,sans-serif}
.pills{position:absolute;left:32px;top:54px;width:1639px;display:flex;gap:29px}
.pill{position:relative;flex:1;height:44px;border-radius:14px;color:#fff;font:700 25px/44px Barlow,sans-serif;padding-left:12px}
.pill u{position:absolute;right:4px;top:4px;width:80px;height:36px;border-radius:18px;text-decoration:none;text-align:center;font-size:27px;line-height:36px}
.lt.two{width:1000px}.lt.two .win{left:792px}.lt.two .pills{width:955px;gap:17px}
.rbclip{position:absolute;left:1125px;top:0;width:687px;height:110px;overflow:hidden}
#rb{left:0;width:687px;background-position:-1017px 0}
#rbtw{position:absolute;left:16px;top:0;width:390px;height:54px}
#rbtw h1{left:0}
#rbc{left:auto;right:17px;width:auto;padding:0 12px}
#rb .pills{left:16px;width:655px;gap:43px}
#rb .pill u{width:100px}
/* menu */
.menu{padding:60px;background:#18242e;color:#fff;width:1920px;height:1080px;font-size:30px}
.menu a{color:#18bff4;display:block;margin:14px 0}
</style></head><body><div id="app"></div>
<script>
'use strict';
const BUILD='build 35 - tidy code, statewide colours';
const CFG=window.CONFIG||{},Q=new URLSearchParams(location.search),view=Q.get('view'),DBG=Q.get('debug');
const $=h=>{document.getElementById('app').innerHTML=h};
const byId=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- sheet layout ---------- */
/* LiveStream is read in blocks so every column is one data type (Google's gviz blanks cells whose type differs from
   the rest of their column) and rows never shift. [range, first sheet row, row count] */
const BLOCKS=[['A4:B4',4,1],['A7:C11',7,5],['A14:AU14',14,1],['A15:X15',15,1],['A17:B17',17,1]];
const R={counted:4,state:7,seat:14,names:15,lower:17};          /* LiveStream rows */
const C={inc:1,call:2,prim:3,tcp:24,counted:45};                 /* columns of a seat row (FullResults, LiveStream row 14) */

/* Statewide parties: [sheet key, full-screen label, lower-third label, lower-third short label, colour (same as seat results)] */
const STATE=[['labor','LABOR','LABOR','ALP','#F00011'],['coalition','COALITION','LIB/NAT','L/NP','#080CAB'],['greens','GREENS','GREENS','GRN','#10C25B'],['onenation','ONE NATION','ONE NATION','ONP','#ff6d00'],['other','OTHER','OTHERS','OTH','#191919']];
const OTHER=4;
/* Call / incumbent text -> party index (5 = independent) -> display name */
const KEYS={labor:0,alp:0,lib:1,lnp:1,nat:1,coalition:1,green:2,greens:2,onenation:3,pon:3,other:4,others:4,ind:5,independent:5};
const CN=['LABOR','COALITION','GREENS','ONE NATION','OTHER','INDEPENDENT'];
/* Seat-result columns in sheet order: primary = column 3+i, 2CP = 24+i. Independent One..Four are in ballot order. */
const CATS=[['Labor','#F00011'],['Liberals','#080CAB'],['Nationals','#137c46'],['Greens','#10C25B'],['One Nation','#ff6d00'],['Victorian Socialists','#000000'],['Independent','#888888'],['Independent','#888888'],['Independent','#888888'],['Independent','#888888'],['Family First','#5A58A6'],['Animal Justice','#5B2C86'],['Libertarian','#fec327'],['Socialist Alliance','#990000'],['Legalise Cannabis','#72C342'],['The Republican','#022168'],['The West Party','#499567'],['Shooters, Fishers & Farmers','#E52B50'],['Citizens Party','#666600'],['Democrats','#FFCD00'],['Democratic Labour','#ffb536']];
const CALL_CATS={0:[0],1:[1,2],2:[3],3:[4],5:[6,7,8,9]};       /* called party -> the CATS columns it covers (for the call pill colour) */

/* ---------- helpers ---------- */
const cell=(g,r,c)=>((g[r-1]||[])[c]||'').trim();
const nk=x=>(x||'').toLowerCase().replace(/[^a-z]/g,'');
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* percentages arrive formatted ("42.31%") or as fractions (0.4231): returns 0-100, or NaN when blank */
function pct(v){v=String(v==null?'':v);if(v==='')return NaN;const n=parseFloat(v.replace(/[%,]/g,''));return isNaN(n)?NaN:(v.includes('%')||n>1.0001?n:n*100)}
const fmt=(n,d=2)=>isNaN(n)?'-':n.toFixed(d)+'%';
/* candidate cells hold "SURNAME, Given" (several joined by ";", optionally followed by a party in brackets) */
const firstCand=t=>(t||'').split(';')[0].replace(/\s*\([^)]*\)\s*$/,'').trim();
const fullName=t=>{t=firstCand(t);const i=t.indexOf(',');return (i>0?t.slice(i+1).trim()+' '+t.slice(0,i).trim():t).toUpperCase()};
const lastName=t=>{t=firstCand(t);if(!t)return '';const i=t.indexOf(',');return (i>0?t.slice(0,i):t.split(/\s+/).pop()).trim().toUpperCase()};
const lighten=c=>'#'+[1,3,5].map(i=>Math.round(parseInt(c.substr(i,2),16)*.67+255*.33).toString(16).padStart(2,'0')).join('');
/* shrink an element's font until it is no wider than w */
function fitW(el,max,w){let f=max;el.style.fontSize=f+'px';while(el.getBoundingClientRect().width>w&&f>12){f-=1;el.style.fontSize=f+'px'}}
/* shrink every match of sel until it fits its parent (after web fonts load) */
const fit=(sel,max)=>document.fonts.ready.then(()=>document.querySelectorAll(sel).forEach(e=>{let f=max;e.style.fontSize=f+'px';while(e.scrollWidth>e.parentElement.clientWidth&&f>20){f-=2;e.style.fontSize=f+'px'}}));
/* statewide table rows are matched by party name, so their order in the sheet doesn't matter */
function stateRow(g,i){for(let r=R.state;r<R.state+5;r++){const k=nk(cell(g,r,0));if(k===STATE[i][0]||(i===2&&k==='green')||(i===OTHER&&k==='others'))return r}return R.state+i}
const seatsCalled=(g,i)=>{const v=parseInt(cell(g,stateRow(g,i),2));return isNaN(v)?'-':v};
const winnerName=inc=>inc?(KEYS[nk(inc)]!==undefined?CN[KEYS[nk(inc)]]:inc.toUpperCase()):'';

/* ---------- shared pieces ---------- */
const clockHTML=()=>`<div class="clock"><div class="live">LIVE</div><img src="assets/dark_logo.jpg"><div class="time" id="t">--:-- AEDT</div></div>`;
const circles=()=>[264,211,158,105,52].map((r,i)=>`<div class="circ" style="width:${2*r}px;height:${2*r}px;left:${1920-r}px;top:${-r}px;background:var(--c${i})"></div>`).join('');
const cardHTML=(title,cnt,rows)=>`<div class="stage bg"><div class="card"><div class="ttl"><span class="f">${title}</span></div><div class="cnt">${cnt}</div></div><div class="abs" style="left:108px;top:67px">${rows}</div>${circles()}${clockHTML()}</div>`;

/* clock: rotates through the states every 3s showing each one's local time; driven by the wall clock so every graphic is in sync */
const ZONES=[['TAS','Australia/Hobart'],['VIC','Australia/Melbourne'],['NSW','Australia/Sydney'],['ACT','Australia/Sydney'],['QLD','Australia/Brisbane'],['SA','Australia/Adelaide'],['NT','Australia/Darwin'],['WA','Australia/Perth']];
const ZONE_MS=3000,FMT={};
function tick(){const e=byId('t');if(!e)return;const [lab,tz]=ZONES[Math.floor(Date.now()/ZONE_MS)%ZONES.length];
 const f=FMT[tz]||(FMT[tz]=new Intl.DateTimeFormat('en-AU',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}));
 const txt=f.format(new Date()).replace(/^24/,'00')+' '+lab;if(e.textContent!==txt)e.textContent=txt}

/* ---------- statewide results ---------- */
/* Other is always last, unless it has votes while another party is still on 0/blank: then it sits above those */
function orderWithOtherLast(A){const oth=A.find(x=>x.i===OTHER),rest=A.filter(x=>x!==oth).sort((a,b)=>b.k-a.k||a.i-b.i);
 let at=rest.length;if(oth.k>0){const z=rest.findIndex(x=>x.k<=0);if(z>=0)at=z}rest.splice(at,0,oth);return rest}
function stateView(g){
 const L=STATE.map((p,i)=>{const v=pct(cell(g,stateRow(g,i),1));return{i,lab:p[1],col:p[4],v,k:isNaN(v)?-1:+v.toFixed(2)}});
 const cnt=fmt(pct(cell(g,R.counted,1)));
 $(cardHTML('LEGISLATIVE ASSEMBLY',cnt==='-'?'-':cnt+' COUNTED',orderWithOtherLast(L).map((x,j)=>`<div class="row" style="top:${220+134*j}px"><b style="color:${x.col}">${x.lab}</b><i style="background:${x.col}">${fmt(x.v)}</i></div>`).join('')));
 fit('.f',105)}

/* ---------- individual seat ---------- */
/* every candidate when there are 6 or fewer, otherwise the top 5 by primary vote + Other. Row 14 = results, row 15 = names */
function seatView(g){
 const seat=cell(g,R.seat,0),win=winnerName(cell(g,R.seat,C.inc));
 const L=CATS.map(([lab,col],i)=>({i,lab,col,v:pct(cell(g,R.seat,C.prim+i)),n:cell(g,R.names,C.prim+i),t:pct(cell(g,R.seat,C.tcp+i))}));
 const known=L.some(x=>x.n),named=L.reduce((a,x)=>a+(x.n?x.n.split(';').filter(z=>z.trim()).length:0),0),showAll=known&&named<=6;
 const pool=L.filter(x=>!known||x.n||x.v>0).sort((a,b)=>((isNaN(b.v)?-1:b.v)-(isNaN(a.v)?-1:a.v))||a.i-b.i);   /* no results yet: sheet order */
 const top=showAll?pool:pool.slice(0,5),two=L.filter(x=>x.t>0).length===2;   /* 2CP pills only when exactly two parties have a 2CP result */
 const rows=top.map(x=>({big:x.n?esc(fullName(x.n)):x.lab.toUpperCase(),sub:x.n?x.lab.toUpperCase():'',col:x.col,v:fmt(x.v),t:two&&x.t>0?fmt(x.t):''}));
 if(!showAll){const ov=L.filter(x=>!top.includes(x)&&!isNaN(x.v)).map(x=>x.v);rows.push({big:'OTHER',sub:'',col:'#191919',v:fmt(ov.length?ov.reduce((a,b)=>a+b,0):NaN),t:''})}
 const pill=(x,left,v)=>`<i style="background:${x.col};left:${left}px">${v}</i>`;
 const html=rows.map((x,j)=>`<div class="row s" style="top:${220+114*j}px">${x.sub?`<b class="cand" style="color:${x.col}"><div class="nmbox"><span class="nm">${x.big}</span></div><div class="sub">${x.sub}</div></b>`:`<b style="color:${x.col}">${x.big}</b>`}${pill(x,two?973:1269,x.v)}${x.t?pill(x,1269,x.t):''}</div>`).join('');
 const sc=fmt(pct(cell(g,R.seat,C.counted)));
 $(cardHTML(seat.toUpperCase()||'-',[sc==='-'?(win?'':'-'):sc+' COUNTED',win?'2022 WINNER: '+win:''].filter(Boolean).join(' | '),html));
 fit('.f',105);fit('.nm',52)}

/* ---------- seat called ---------- */
/* party on top filling the full width (condensed cut if Barlow Bold would be too short), seat line below at up to 90% of
   that width, fixed gap between them, whole block centred in the card */
const CX=document.createElement('canvas').getContext('2d');
function tm(f,size,t){CX.font=`${f[1]} ${size}px ${f[0]},sans-serif`;const m=CX.measureText(t),h=CX.measureText('H');return{w:(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)||m.width,cap:h.actualBoundingBoxAscent||size*.7,A:m.fontBoundingBoxAscent??size*.95,D:m.fontBoundingBoxDescent??size*.25}}
function putText(id,t,f,max,boxW,top){const el=byId(id);if(!el)return;let sz=max;const w=tm(f,sz,t).w;if(w>boxW)sz=Math.max(20,Math.floor(max*boxW/w));
 const m=tm(f,sz,t);el.textContent=t;el.style.fontFamily=f[0]+',sans-serif';el.style.fontWeight=f[1];el.style.fontSize=sz+'px';el.style.top=(top+m.cap-(m.A-m.D)/2)+'px'}
function placeCalled(seat,party){const go=()=>{
  const F1=['Barlow',700],F2=["'Barlow Condensed'",700],SF=['Barlow',800],BW=1560,GAP=75;let f=F1,sz=BW/tm(F1,100,party).w*100;
  if(sz<400){f=F2;sz=BW/tm(F2,100,party).w*100}
  sz=party==='-'?460:Math.min(600,Math.floor(sz));
  const pw=party==='-'?BW:tm(f,sz,party).w,pcap=tm(f,sz,'H').cap;
  let ss=200;const sw=tm(SF,200,seat).w;if(sw>pw*.9)ss=Math.max(20,Math.floor(200*pw*.9/sw));
  const top=473-(pcap+GAP+tm(SF,ss,'H').cap)/2;                /* card is 946px tall */
  putText('pt',party,f,sz,BW,top);putText('sn',seat,SF,ss,pw*.9,top+pcap+GAP)};
 Promise.all(['800 100px Barlow','700 100px Barlow','700 100px "Barlow Condensed"'].map(x=>document.fonts.load(x))).then(go,go);go()}
function calledView(g){
 const seat=cell(g,R.seat,0),call=cell(g,R.seat,C.call),k=KEYS[nk(call)],w=call?(k===undefined?OTHER:k):-1,ik=KEYS[nk(cell(g,R.seat,C.inc))];
 $(`<div class="stage bg"><div class="card"><img class="abs" src="assets/projects_logo.png" style="left:472px;top:23px;width:717px"><span class="ct" id="sn" style="color:#000"></span><span class="ct" id="pt" style="color:var(--c${w<0?OTHER:w})"></span></div>${circles()}${clockHTML()}</div>`);
 placeCalled((w>=0&&ik!==undefined?(w===ik?'HOLD ':'GAIN '):'')+(seat.toUpperCase()||'-'),w<0?'-':CN[w])}

/* ---------- lower third: normal / "Show 2CP" (LiveStream!B17) ---------- */
/* switching layout sinks the whole bar into the portal and back; in 2CP mode the seat box swipes to the next seat every TCP_ROTATE_MS */
const LT={g:null,built:null,busy:false,seat:null,deck:[],seatTs:0},ALL={full:[],cands:[],ts:0};
async function loadAll(){const f=async(rg,sh)=>parseSheet(await fetchText(rg,sh),88);
 [ALL.full,ALL.cands]=await Promise.all([f('A2:AU89',CFG.RESULTS_TAB||'FullResults'),f('A2:V89',CFG.CANDS_TAB||'Candidates')]);ALL.ts=Date.now()}
/* a seat's 2CP: exactly two parties with a 2CP value, highest first */
function tcpOf(r){const v=CATS.map((_,i)=>({i,p:pct(r[C.tcp+i])})).filter(x=>x.p>0);return v.length===2?v.sort((a,b)=>b.p-a.p):null}
const eligible=()=>ALL.full.filter(r=>r[0]&&tcpOf(r)).map(r=>r[0]);
function nextSeat(){const el=eligible();if(!el.length)return null;LT.deck=LT.deck.filter(x=>el.includes(x));
 if(!LT.deck.length){LT.deck=el.slice().sort(()=>Math.random()-.5);if(el.length>1&&LT.deck[LT.deck.length-1]===LT.seat)LT.deck.reverse()}  /* shuffled: no repeats until every seat has been shown */
 return LT.deck.pop()}
const wantTwo=g=>/show/i.test(cell(g,R.lower,1))&&eligible().length>0;
function ltHTML(two,g){
 const left=`<div class="lt${two?' two':''}"><h1>VICTORIA DECIDES</h1><div class="win">TO WIN: 45</div><div class="pills">${STATE.map((p,i)=>`<div class="pill" style="background:var(--c${i})"><span>${two?p[3]:p[2]}</span><u id="lp${i}" style="background:var(--l${i})">${seatsCalled(g,i)}</u></div>`).join('')}</div></div>`;
 return two?left+`<div class="rbclip"><div class="lt" id="rb"><div id="rbtw"><h1><span class="pn" id="rbt">-</span></h1></div><div class="win" id="rbc">NOT YET CALLED</div><div class="pills">${[0,1].map(j=>`<div class="pill" id="rp${j}"><span class="pn">-</span><u>-</u></div>`).join('')}</div></div></div>`:left}
function fillLeft(g){STATE.forEach((p,i)=>{const e=byId('lp'+i);if(e)e.textContent=seatsCalled(g,i)})}
function fillRB(){const rb=byId('rb'),row=rb&&ALL.full.find(r=>r[0]===LT.seat),t=row&&tcpOf(row);if(!t)return;
 const cr=ALL.cands.find(c=>nk(c[0])===nk(LT.seat))||[];
 t.forEach((x,j)=>{const col=CATS[x.i][1],p=byId('rp'+j),u=p.querySelector('u'),n=p.querySelector('.pn');
  p.style.background=col;n.textContent=lastName(cr[1+x.i])||CATS[x.i][0].toUpperCase();fitW(n,25,180);u.style.background=lighten(col);u.textContent=x.p.toFixed(1)+'%'});
 const call=row[C.call],k=KEYS[nk(call)],ik=KEYS[nk(row[C.inc])],kk=k===undefined?OTHER:k,rbc=byId('rbc'),inPct=pct(row[C.counted]);
 rbc.textContent=(isNaN(inPct)?'':inPct.toFixed(1)+'% IN | ')+(call?CN[kk]+(ik===undefined?'':(k===ik?' HOLD':' GAIN')):'NOT YET CALLED');
 const share=CALL_CATS[kk],hit=share&&t.find(x=>share.includes(x.i));   /* call pill takes the winning party's colour */
 rbc.style.background=call?(share?CATS[hit?hit.i:share[0]][1]:'#191919'):'';
 const room=rbc.getBoundingClientRect().left-rb.getBoundingClientRect().left-32,e=byId('rbt');   /* seat name shrinks to fit beside the call pill */
 byId('rbtw').style.width=room+'px';e.textContent=LT.seat.toUpperCase();fitW(e,40,room)}
/* move el out to transform `out`, swap its content, move it back: [out seconds, swap after ms, back seconds, done after ms] */
function animate(el,out,[s1,swapMs,s2,doneMs],swap,done){el.style.transition=`transform ${s1}s cubic-bezier(.55,0,1,.45)`;el.style.transform=out;
 setTimeout(()=>{swap();el.style.transition='none';void el.offsetHeight;el.style.transition=`transform ${s2}s cubic-bezier(0,.55,.45,1)`;el.style.transform=out.replace(/-?\d+px/,'0');setTimeout(done,doneMs)},swapMs)}
const portal=(el,swap,done)=>animate(el,'translateY(125px)',[.5,540,.55,600],swap,done);    /* sinks fully below the clipped edge */
const swipe=(el,swap,done)=>animate(el,'translateX(-700px)',[.45,470,.5,520],swap,done);    /* slides left out of its window and back */
function ensureSeat(){if(!LT.seat||!eligible().includes(LT.seat)){LT.seat=nextSeat();LT.seatTs=Date.now()}}
function lowerUpdate(){const g=LT.g;if(!g)return;const two=wantTwo(g),el=byId('ltin');
 if(!el){$(`<div class="stage"><div class="portal"><div id="ltin">${ltHTML(two,g)}</div></div>${clockHTML()}</div>`);LT.built=two;if(two){ensureSeat();fillRB();LT.seatTs=Date.now()}return}
 if(two!==LT.built&&!LT.busy){LT.busy=true;portal(el,()=>{LT.built=wantTwo(LT.g);el.innerHTML=ltHTML(LT.built,LT.g);if(LT.built){ensureSeat();fillRB()}},()=>{LT.busy=false;LT.seatTs=Date.now()})}
 if(!LT.busy){fillLeft(g);if(LT.built){ensureSeat();fillRB()}}}
function rotate(){const rb=byId('rb');if(!rb||LT.busy||!LT.built||Date.now()-LT.seatTs<(CFG.TCP_ROTATE_MS||10000))return;   /* each seat stays up the full time */
 const nx=nextSeat();if(!nx)return;LT.busy=true;swipe(rb,()=>{LT.seat=nx;fillRB()},()=>{LT.busy=false;LT.seatTs=Date.now()})}

/* ---------- menu + view dispatch ---------- */
const MENU=[['clock','Clock / Logo'],['seat','Individual Seat Results'],['called','Seat Called'],['state','Statewide Results'],['lower','Lower Third']];
const VIEWS={
 clock:()=>$(`<div class="stage">${clockHTML()}</div>`),
 state:stateView,seat:seatView,called:calledView,
 lower:g=>{LT.g=g;lowerUpdate()},
 menu:()=>$(`<div class="menu"><h1>6News Election Graphics</h1><br>${MENU.map(a=>`<a href="?view=${a[0]}">${a[1]} &rarr; ?view=${a[0]}</a>`).join('')}<p style="margin-top:30px;font-size:22px;color:#aaa">${CFG.SHEET_ID?BUILD+' - live sheet connected.':'No SHEET_ID set in config.js - graphics show -.'}</p></div>`)};
function render(g){(VIEWS[view]||VIEWS.menu)(g);tick()}

/* ---------- data: Google Sheets (gviz JSON), polled every POLL_MS; redraws only when the data changes ---------- */
const gurl=(rg,sh)=>`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:json&headers=0&range=${rg}&sheet=${encodeURIComponent(sh||CFG.LIVE_TAB||'LiveStream')}&_=${Date.now()}`;
async function fetchText(rg,sh){const r=await fetch(gurl(rg,sh),{cache:'no-store'});if(!r.ok)throw new Error('Google returned HTTP '+r.status+' for '+rg);return r.text()}
function parseSheet(raw,n){const m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);if(!m)throw new Error('Google did not return sheet data (sheet not shared as "Anyone with the link", wrong sheet ID, or wrong tab name)');
 const T=JSON.parse(m[1]).table,v=c=>c?(c.f!=null?String(c.f):(c.v!=null?String(c.v):'')):'';
 const g=T.rows.map(r=>T.cols.map((_,i)=>v((r.c||[])[i])));
 const h=T.cols.map(c=>c.label||'');if(g.length<n&&h.some(x=>x))g.unshift(h);   /* a row Google treated as a header goes back in as data */
 return g}
function dbg(t){if(!DBG)return;let d=byId('dbg');if(!d){d=document.createElement('pre');d.id='dbg';d.style.cssText='position:fixed;left:0;bottom:0;z-index:9;background:#000c;color:#0f0;font:16px monospace;padding:6px;max-width:1900px;white-space:pre-wrap';document.body.appendChild(d)}
 d.textContent=BUILD+' | sheet ...'+String(CFG.SHEET_ID||'(none)').slice(-6)+' | tab '+(CFG.LIVE_TAB||'LiveStream')+'\n'+t}
let last=null;
function draw(t){if(t===last)return false;last=t;render(t?JSON.parse(t):[[]]);return true}
async function poll(){
 try{if(!CFG.SHEET_ID)draw('');else{
  const res=await Promise.all(BLOCKS.map(async([rg,s0,n])=>[s0,parseSheet(await fetchText(rg),n)]));
  const g=[];res.forEach(([s0,rows])=>rows.forEach((r,i)=>g[s0-1+i]=r));for(let i=0;i<g.length;i++)g[i]=g[i]||[];
  if(view==='lower'){LT.g=g;if(/show/i.test(cell(g,R.lower,1))&&Date.now()-ALL.ts>10000){try{await loadAll()}catch(e){console.error('2CP data fetch failed',e);ALL.ts=Date.now()-5000}}}
  const t=JSON.stringify(g);store.set('6n',t);if(!draw(t)&&view==='lower')lowerUpdate();   /* 2CP data can change while LiveStream doesn't */
  dbg([4,7,8,9,10,11,14,15,17].map(r=>r+': '+JSON.stringify(g[r-1])).join('\n'))}}
 catch(e){console.error('Sheet fetch failed',e);dbg('FETCH FAILED: '+e.message);if(last===null)draw(store.get('6n')||'')}   /* on error the last good data stays on screen */
 setTimeout(poll,CFG.POLL_MS||2000)}
if(CFG.SHEET_ID&&store.get('6n'))draw(store.get('6n'));   /* show the last known data straight away while the first fetch runs */
poll();setInterval(tick,250);if(view==='lower')setInterval(rotate,500);
</script></body></html>
