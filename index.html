<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>6News Election Graphics</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--c0:#f0000d;--c1:#0050b1;--c2:#408f38;--c3:#e67f00;--c4:#929290;--l0:#f5535d;--l1:#2f74c9;--l2:#4eac61;--l3:#e69849;--l4:#adadab}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Trebuchet MS',sans-serif}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{background:linear-gradient(#18bff4,#2578bd)}
.card{position:absolute;left:108px;top:44px;width:1704px;height:946px;background:#efefef;border-radius:16px}
.circ{position:absolute;border-radius:50%;filter:drop-shadow(-3px 4px 5px rgba(0,0,0,.35))}
.abs{position:absolute}
.title{position:absolute;left:0;width:1704px;top:54px;height:110px;line-height:110px;text-align:center;font:800 105px/110px Barlow,sans-serif;color:#000;white-space:nowrap}
.cnt{position:absolute;left:0;width:1704px;top:154px;text-align:center;font:500 52px/56px 'Barlow Condensed',sans-serif;color:#000}
.fitbox{position:absolute;left:326px;width:1052px;text-align:center;white-space:nowrap}
.fitbox span{display:inline-block}
.row{position:absolute;left:58px;width:1588px;height:114px;background:#fff;border-radius:16px}
.row b{position:absolute;left:12px;line-height:114px;font:700 70px/114px 'Trebuchet MS',sans-serif}
.row i{position:absolute;left:1136px;top:13px;width:413px;height:88px;border-radius:12px;color:#fff;text-align:center;font:700 70px/88px 'Trebuchet MS',sans-serif}
/* clock */
.clock{position:absolute;left:0;top:38px;width:209px;height:163px;border-radius:0 20px 20px 0;overflow:hidden;font-weight:700;color:#fff;text-align:center}
.clock .live{height:38px;line-height:38px;background:#ff6048;font-size:26px}
.clock img{display:block;width:209px;height:87px}
.clock .time{height:38px;line-height:38px;background:#3ba5e6;font-size:27px}
/* lower third */
.lt{position:absolute;left:108px;top:925px;width:1704px;height:110px;border-radius:20px;background:linear-gradient(90deg,#18bff4,#2578bd)}
.lt h1{position:absolute;left:33px;top:6px;font:700 40px/52px Barlow,sans-serif;color:#fff}
.win{position:absolute;left:1496px;top:8px;width:175px;height:38px;border-radius:14px;background:linear-gradient(90deg,#6b6c7c,#0a0d17);color:#fff;text-align:center;font:700 25px/38px Barlow,sans-serif}
.pills{position:absolute;left:32px;top:54px;width:1639px;display:flex;gap:29px}
.pill{position:relative;flex:1;height:44px;border-radius:14px;color:#fff;font:700 25px/44px 'Trebuchet MS',sans-serif;padding-left:12px}
.pill u{position:absolute;right:4px;top:4px;width:80px;height:36px;border-radius:18px;text-decoration:none;text-align:center;font-size:27px;line-height:36px}
.menu{padding:60px;background:#18242e;color:#fff;width:1920px;height:1080px;font-size:30px}
.menu a{color:#18bff4;display:block;margin:14px 0}
</style></head><body><div id="app"></div>
<script>
const P=[['Labor','LABOR','LABOR'],['LibNat','LIBERAL/NATIONAL','LIB/NAT'],['Green','GREENS','GREENS'],['One Nation','ONE NATION','ONE NATION'],['Other','OTHER','OTHERS']];
const KEYS={labor:0,alp:0,libnat:1,liberal:1,lib:1,lnp:1,nat:1,coalition:1,green:2,greens:2,onenation:3,pon:3,other:4,others:4,ind:4,independent:4};
const DEMO=['Statistics,%','CountedLA,42.31','CountedLC,','','Assembly,Seats Called,Primary','Labor,31,36.52','LibNat,22,33.10','Greens,4,12.04','OneNation,3,9.87','Other,2,8.47',...Array(9).fill(''),'Seat,Incumbent,Call,Labor,LibNat,Green,One Nation,Other','Bendigo East,Labor,Labor,41.20,30.15,8.40,12.60,7.65'].join('\n');
const view=new URLSearchParams(location.search).get('view');
const $=h=>document.getElementById('app').innerHTML=h;
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}row.push(c);r.push(row);return r}
const cell=(g,r,c)=>((g[r-1]||[])[c]||'').trim();
let FRAC=false;
function pc(v,d){if(v==='')return '--.--%';const n=parseFloat(v.replace(/[%,]/g,''));if(isNaN(n))return '--.--%';return (FRAC&&!v.includes('%')?n*100:n).toFixed(2)+'%'}
function detect(g){const v=[6,7,8,9,10].map(r=>cell(g,r,2)).filter(x=>x&&!x.includes('%')).map(parseFloat);FRAC=v.length>0&&v.reduce((a,b)=>a+b,0)<=1.01}
const clockHTML=()=>`<div class="clock"><div class="live">LIVE</div><img src="assets/dark_logo.jpg"><div class="time" id="t">--:-- AEDT</div></div>`;
function tick(){const e=document.getElementById('t');if(e)e.textContent=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(/^24/,'00')+' AEDT'}
const circles=()=>[264,211,158,105,52].map((r,i)=>`<div class="circ" style="width:${2*r}px;height:${2*r}px;left:${1920-r}px;top:${-r}px;background:var(--c${i})"></div>`).join('');
const fit=(sel,max)=>document.fonts.ready.then(()=>document.querySelectorAll(sel).forEach(s=>{let f=max;s.style.fontSize=f+'px';while(s.scrollWidth>s.parentElement.clientWidth&&f>20){f-=2;s.style.fontSize=f+'px'}}));
function rows(vals,counted,title,id){
 return `<div class="stage bg"><div class="card"><div class="fitbox" style="top:54px;height:110px;font:800 105px/110px Barlow,sans-serif;color:#000"><span class="${id}">${title}</span></div><div class="cnt">${counted} COUNTED</div></div>`+
 `<div class="abs" style="left:108px;top:44px">${P.map((p,i)=>`<div class="row" style="top:${220+134*i}px"><b style="color:var(--c${i})">${p[1]}</b><i style="background:var(--c${i})">${vals[i]}</i></div>`).join('')}</div>${circles()}</div>`}
function render(g){
 detect(g);const counted=pc(cell(g,2,1));
 const seat=cell(g,21,0),inc=cell(g,21,1),call=cell(g,21,2),sv=[3,4,5,6,7].map(c=>pc(cell(g,21,c)));
 if(view=='clock'){$(`<div class="stage">${clockHTML()}</div>`)}
 else if(view=='state'){$(rows([6,7,8,9,10].map(r=>pc(cell(g,r,2))),counted,'LEGISLATIVE ASSEMBLY','f'));fit('.f',105)}
 else if(view=='seat'){$(rows(sv,counted,seat.toUpperCase(),'f'));fit('.f',105)}
 else if(view=='called'){
  const k=KEYS[call.toLowerCase().replace(/[^a-z]/g,'')],w=call?(k===undefined?4:k):-1,ik=KEYS[inc.toLowerCase().replace(/[^a-z]/g,'')];
  const sub=w<0?'':(w===ik?'RETAIN':'GAIN'+(ik>=0?' FROM '+P[ik][1]:''));
  $(`<div class="stage bg"><div class="card">
   <img class="abs" src="assets/projects_logo.png" style="left:472px;top:23px;width:717px">
   <div class="fitbox" style="top:150px;height:230px;font:800 200px/230px Barlow,sans-serif"><span class="f">${seat.toUpperCase()}</span></div>
   <div class="fitbox" style="left:152px;width:1400px;top:360px;height:420px;font:700 440px/420px Barlow,sans-serif;color:var(${w<0?'--c4':'--c'+w})"><span class="g">${w<0?'NO CALL YET':P[w][2]}</span></div>
   <div class="fitbox" style="top:790px;height:70px;font:600 56px/70px Barlow,sans-serif;color:#222"><span class="h">${sub}</span></div></div>${circles()}${clockHTML()}</div>`);
  fit('.f',200);fit('.g',440);fit('.h',56)}
 else if(view=='lower'){
  $(`<div class="stage"><div class="lt"><h1>VICTORIA DECIDES</h1><div class="win">TO WIN: 45</div><div class="pills">${P.map((p,i)=>`<div class="pill" style="background:var(--c${i})">${p[2]}<u style="background:var(--l${i})">${parseInt(cell(g,6+i,1))||0}</u></div>`).join('')}</div></div></div>`)}
 else $(`<div class="menu"><h1>6News Election Graphics</h1><br>${[['clock','Clock / Logo'],['seat','Individual Seat Results'],['called','Seat Called'],['state','Statewide Results'],['lower','Lower Third']].map(a=>`<a href="?view=${a[0]}">${a[1]} &rarr; ?view=${a[0]}</a>`).join('')}<p style="margin-top:30px;font-size:22px;color:#aaa">${CONFIG.SHEET_CSV_URL?'Live sheet connected.':'No sheet URL set in config.js - showing demo data.'}</p></div>`);
 tick()}
(async()=>{
 const c=localStorage.getItem('6n');if(c)render(parseCSV(c));
 try{const u=CONFIG.SHEET_CSV_URL;let t=DEMO;if(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;t=await r.text();localStorage.setItem('6n',t)}render(parseCSV(t))}
 catch(e){if(!c)render(parseCSV(DEMO))}
 setInterval(tick,1000);
 if(view)setTimeout(()=>location.reload(),10000);
})();
</script></body></html>
