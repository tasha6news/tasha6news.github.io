<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>6News Election Graphics</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--c0:#f0000d;--c1:#0050b1;--c2:#408f38;--c3:#e67f00;--c4:#929290;--c5:#0f9d9a;--l0:#f5535d;--l1:#2f74c9;--l2:#4eac61;--l3:#e69849;--l4:#adadab}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Trebuchet MS',sans-serif}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{background:linear-gradient(#18bff4,#2578bd)}
.card{position:absolute;left:108px;top:44px;width:1704px;height:946px;background:#efefef;border-radius:16px}
.circ{position:absolute;border-radius:50%;filter:drop-shadow(-3px 4px 5px rgba(0,0,0,.35))}
.abs{position:absolute}
.title{position:absolute;left:0;width:1704px;top:54px;height:110px;line-height:110px;text-align:center;font:800 105px/110px Barlow,sans-serif;color:#000;white-space:nowrap}
.cnt{position:absolute;left:0;width:1704px;top:154px;text-align:center;font:500 52px/56px 'Barlow Condensed',sans-serif;color:#000}
.ct{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;line-height:0}
.fitbox{position:absolute;left:326px;width:1052px;text-align:center;white-space:nowrap}
.fitbox span{display:inline-block}
.row{position:absolute;left:58px;width:1588px;height:114px;background:#fff;border-radius:16px}
.row b{position:absolute;left:12px;line-height:114px;font:700 70px/114px 'Trebuchet MS',sans-serif}
.row i{position:absolute;left:1136px;top:13px;width:413px;height:88px;border-radius:12px;color:#fff;text-align:center;font:700 70px/88px 'Trebuchet MS',sans-serif}
/* clock */
.clock{position:absolute;left:0;top:37px;width:209px;height:163px;border-radius:0 20px 20px 0;overflow:hidden;font-weight:700;color:#fff;text-align:center}
.clock .live{height:38px;line-height:38px;background:#ff6048;font-size:26px}
.clock img{display:block;width:209px;height:88px;object-fit:cover}
.clock .time{height:38px;line-height:38px;background:#3ba5e6;font-size:27px}
/* lower third */
.lt{position:absolute;left:108px;top:925px;width:1704px;height:110px;border-radius:20px;background:linear-gradient(90deg,#18bff4,#2578bd)}
.lt h1{position:absolute;left:33px;top:0;font:700 40px/50px Barlow,sans-serif;color:#fff}
.win{position:absolute;left:1496px;top:8px;width:175px;height:38px;border-radius:14px;background:linear-gradient(90deg,#6b6c7c,#0a0d17);color:#fff;text-align:center;font:700 25px/38px Barlow,sans-serif}
.pills{position:absolute;left:32px;top:54px;width:1639px;display:flex;gap:29px}
.pill{position:relative;flex:1;height:44px;border-radius:14px;color:#fff;font:700 25px/44px 'Trebuchet MS',sans-serif;padding-left:12px}
.pill u{position:absolute;right:4px;top:4px;width:80px;height:36px;border-radius:18px;text-decoration:none;text-align:center;font-size:27px;line-height:36px}
.menu{padding:60px;background:#18242e;color:#fff;width:1920px;height:1080px;font-size:30px}
.menu a{color:#18bff4;display:block;margin:14px 0}
</style></head><body><div id="app"></div>
<script>
const BUILD='build 11 - fixed call layout';
const CN=['LABOR','COALITION','GREENS','ONE NATION','OTHER','INDEPENDENT'];
const P=[['Labor','LABOR','LABOR'],['LibNat','COALITION','LIB/NAT'],['Green','GREENS','GREENS'],['One Nation','ONE NATION','ONE NATION'],['Other','OTHER','OTHERS']];
const KEYS={labor:0,alp:0,libnat:1,liberal:1,lib:1,lnp:1,nat:1,coalition:1,green:2,greens:2,onenation:3,pon:3,other:4,others:4,ind:5,independent:5};
const DEMO='';
const view=new URLSearchParams(location.search).get('view');
const $=h=>document.getElementById('app').innerHTML=h;
/* Each block is requested separately so every column is one data type (Google's gviz nulls out
   cells whose type differs from the rest of the column) and rows never shift. [range, first sheet row, row count] */
const BLOCKS=[['A2:B3',2,2],['A6:C10',6,5],['A21:J21',21,1]];
function parseSheet(raw,n){const m=raw.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);if(!m)throw new Error('bad response');
 const T=JSON.parse(m[1]).table,v=c=>c?(c.f!=null?String(c.f):(c.v!=null?String(c.v):'')):'';
 const g=T.rows.map(r=>T.cols.map((_,i)=>v((r.c||[])[i])));
 const h=T.cols.map(c=>c.label||'');
 if(g.length<n&&h.some(x=>x))g.unshift(h); /* a row Google treated as a header goes back in as data */
 return g}
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}row.push(c);r.push(row);return r}
const cell=(g,r,c)=>((g[r-1]||[])[c]||'').trim();
let FRAC=false;
function pc(v,d){if(v==='')return '-';const n=parseFloat(v.replace(/[%,]/g,''));if(isNaN(n))return '-';return (FRAC&&!v.includes('%')?n*100:n).toFixed(2)+'%'}
const SKEY=['labor','libnat','greens','onenation','other'];
const nk=x=>(x||'').toLowerCase().replace(/[^a-z]/g,'');
function srow(g,i){for(let r=6;r<=10;r++){const k=nk(cell(g,r,0));if(k===SKEY[i]||(i===2&&k==='green')||(i===4&&k==='others'))return r}return 6+i}
function detect(g){const v=[6,7,8,9,10].map(r=>cell(g,r,2)).filter(x=>x&&!x.includes('%')).map(parseFloat);FRAC=v.length>0&&v.reduce((a,b)=>a+b,0)<=1.01}
const clockHTML=()=>`<div class="clock"><div class="live">LIVE</div><img src="assets/dark_logo.jpg"><div class="time" id="t">--:-- AEDT</div></div>`;
/* Rotates through Australian time zones; AEDT is held twice as long. Based on the wall clock so every graphic stays in sync. */
const ZONES=[['AEST','Australia/Brisbane',3000],['AEDT','Australia/Melbourne',6000],['ACDT','Australia/Adelaide',3000],['ACST','Australia/Darwin',3000],['AWST','Australia/Perth',3000]];
const ZTOTAL=ZONES.reduce((a,z)=>a+z[2],0),FMT={};
function tick(){const e=document.getElementById('t');if(!e)return;let p=Date.now()%ZTOTAL,z=ZONES[0];for(const q of ZONES){if(p<q[2]){z=q;break}p-=q[2]}
 const f=FMT[z[1]]||(FMT[z[1]]=new Intl.DateTimeFormat('en-AU',{timeZone:z[1],hour:'2-digit',minute:'2-digit',hour12:false}));
 const txt=f.format(new Date()).replace(/^24/,'00')+' '+z[0];if(e.textContent!==txt)e.textContent=txt}
const circles=()=>[264,211,158,105,52].map((r,i)=>`<div class="circ" style="width:${2*r}px;height:${2*r}px;left:${1920-r}px;top:${-r}px;background:var(--c${i})"></div>`).join('');
const fit=(sel,max)=>document.fonts.ready.then(()=>document.querySelectorAll(sel).forEach(s=>{let f=max;s.style.fontSize=f+'px';while(s.scrollWidth>s.parentElement.clientWidth&&f>20){f-=2;s.style.fontSize=f+'px'}}));
/* Seat Called text: seat name baseline is fixed (it grows upward), party cap-top is fixed (it hangs down), so the gap never changes. */
const CX=document.createElement('canvas').getContext('2d');
function tm(f,size,t){CX.font=`${f[1]} ${size}px ${f[0]},sans-serif`;const m=CX.measureText(t),h=CX.measureText('H');return{w:m.width,cap:h.actualBoundingBoxAscent||size*.7,A:m.fontBoundingBoxAscent??size*.95,D:m.fontBoundingBoxDescent??size*.25}}
function putText(id,t,fonts,max,boxW,anchor,y){const el=document.getElementById(id);if(!el)return;let f=fonts[0],sz=max;
 for(const x of fonts){f=x;sz=max;if(tm(x,sz,t).w<=boxW)break;if(x===fonts[fonts.length-1])sz=Math.max(20,Math.floor(max*boxW/tm(x,max,t).w))}
 const m=tm(f,sz,t);el.textContent=t;el.style.fontFamily=f[0]+',sans-serif';el.style.fontWeight=f[1];el.style.fontSize=sz+'px';
 el.style.top=((anchor==='top'?y+m.cap:y)-(m.A-m.D)/2)+'px'}
function placeCalled(seat,party){const go=()=>{
  putText('sn',seat,[['Barlow',800]],200,1500,'bottom',316);
  putText('pt',party,[['Barlow',700],["'Barlow Condensed'",700]],460,1560,'top',391)};
 Promise.all(['800 100px Barlow','700 100px Barlow','700 100px "Barlow Condensed"'].map(x=>document.fonts.load(x))).then(go,go);go()}
function rows(vals,counted,title,id,ind){
 const L=P.map((p,i)=>[p[1],i,vals[i]]);if(ind!==undefined)L.splice(4,0,['INDEPENDENT',5,ind]);
 L.forEach((x,i)=>{const n=parseFloat(x[2]);x.k=isNaN(n)?-1:n;x.o=i});const oth=L.find(x=>x[1]===4),rest=L.filter(x=>x!==oth).sort((a,b)=>b.k-a.k||a.o-b.o);
 /* Other is always last, unless it has votes and another category is still on 0/blank: then it sits above those */
 let at=rest.length;if(oth.k>0){const z=rest.findIndex(x=>x.k<=0);if(z>=0)at=z}
 rest.splice(at,0,oth);L.splice(0,L.length,...rest);
 const six=L.length>5,h=six?98:114,pt=six?114:134,ph=six?76:88,fs=six?60:70;
 return `<div class="stage bg"><div class="card"><div class="fitbox" style="top:54px;height:110px;font:800 105px/110px Barlow,sans-serif;color:#000"><span class="${id}">${title}</span></div><div class="cnt">${counted==='-'?'-':counted+' COUNTED'}</div></div>`+
 `<div class="abs" style="left:108px;top:44px">${L.map((x,i)=>`<div class="row" style="top:${220+pt*i}px;height:${h}px"><b style="color:var(--c${x[1]});line-height:${h}px;font-size:${fs}px">${x[0]}</b><i style="background:var(--c${x[1]});top:${(h-ph)/2}px;height:${ph}px;line-height:${ph}px;font-size:${fs}px">${x[2]}</i></div>`).join('')}</div>${circles()}${clockHTML()}</div>`}
function render(g){
 detect(g);const counted=pc(cell(g,2,1));
 const seat=cell(g,21,0),inc=cell(g,21,1),call=cell(g,21,2),sv=(FRAC=[3,4,5,6,7,8].map(c=>cell(g,21,c)).filter(x=>x&&!x.includes('%')).map(parseFloat).reduce((a,b)=>a+b,0)<=1.01,[3,4,5,6,8].map(c=>pc(cell(g,21,c)))),indV=pc(cell(g,21,7)),seatCounted=pc(cell(g,21,9));
 if(view=='clock'){$(`<div class="stage">${clockHTML()}</div>`)}
 else if(view=='state'){detect(g);$(rows([0,1,2,3,4].map(i=>pc(cell(g,srow(g,i),2))),counted,'LEGISLATIVE ASSEMBLY','f'));fit('.f',105)}
 else if(view=='seat'){$(rows(sv,seatCounted,seat.toUpperCase()||'-','f',indV));fit('.f',105)}
 else if(view=='called'){
  const k=KEYS[call.toLowerCase().replace(/[^a-z]/g,'')],w=call?(k===undefined?4:k):-1;
  $(`<div class="stage bg"><div class="card">
   <img class="abs" src="assets/projects_logo.png" style="left:472px;top:23px;width:717px">
   <span class="ct" id="sn" style="color:#000"></span><span class="ct" id="pt" style="color:var(${w<0?'--c4':'--c'+w})"></span>
</div>${circles()}${clockHTML()}</div>`);
  placeCalled(seat.toUpperCase()||'-',w<0?'-':CN[w])}
 else if(view=='lower'){
  $(`<div class="stage"><div class="lt"><h1>VICTORIA DECIDES</h1><div class="win">TO WIN: 45</div><div class="pills">${P.map((p,i)=>`<div class="pill" style="background:var(--c${i})">${p[2]}<u style="background:var(--l${i})">${(cell(g,srow(g,i),1)===''||isNaN(parseInt(cell(g,srow(g,i),1))))?'-':parseInt(cell(g,srow(g,i),1))}</u></div>`).join('')}</div></div>${clockHTML()}</div>`)}
 else $(`<div class="menu"><h1>6News Election Graphics</h1><br>${[['clock','Clock / Logo'],['seat','Individual Seat Results'],['called','Seat Called'],['state','Statewide Results'],['lower','Lower Third']].map(a=>`<a href="?view=${a[0]}">${a[1]} &rarr; ?view=${a[0]}</a>`).join('')}<p style="margin-top:30px;font-size:22px;color:#aaa">${CONFIG.SHEET_ID?BUILD+' - live sheet connected.':'No SHEET_ID set in config.js - graphics show -.'}</p></div>`);
 tick()}
let last=null,cached=localStorage.getItem('6n');
function draw(t){if(t===last)return;last=t;render(t?JSON.parse(t):[[]])}
const gurl=rg=>`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&headers=0&range=${rg}&sheet=${encodeURIComponent(CONFIG.SHEET_NAME||'LiveStreamData')}&_=${Date.now()}`;
const url=()=>CONFIG.SHEET_ID;
async function poll(){
 try{if(!url())draw(DEMO);else{
  const res=await Promise.all(BLOCKS.map(async([rg,s0,n])=>{const r=await fetch(gurl(rg),{cache:'no-store'});if(!r.ok)throw 0;return [s0,parseSheet(await r.text(),n)]}));
  const g=[];res.forEach(([s0,rows])=>rows.forEach((r,i)=>g[s0-1+i]=r));for(let i=0;i<g.length;i++)g[i]=g[i]||[];
  const t=JSON.stringify(g);localStorage.setItem('6n',t);draw(t);
  if(new URLSearchParams(location.search).get('debug')){let d=document.getElementById('dbg');if(!d){d=document.createElement('pre');d.id='dbg';d.style.cssText='position:fixed;left:0;bottom:0;z-index:9;background:#000c;color:#0f0;font:16px monospace;padding:6px';document.body.appendChild(d)}d.textContent=BUILD+'\n'+[2,3,6,7,8,9,10,21].map(r=>r+': '+JSON.stringify(g[r-1])).join('\n')}}}
 catch(e){console.error('Sheet fetch failed',e);if(last===null)draw(cached||'')} /* on error keep last good data on screen */
 setTimeout(poll,CONFIG.POLL_MS||2000)}
if(cached&&url())draw(cached);
poll();setInterval(tick,250);
</script></body></html>
